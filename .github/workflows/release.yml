name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  RUST_TARGET: x86_64-pc-windows-msvc

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version changed
        id: version
        shell: bash
        run: |
          # Get last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "tag=v0.1.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Compare package.json version with tag
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${LAST_TAG#v}"

          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "tag=v${PKG_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install frontend dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Setup Rust
        if: steps.version.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Rust cache
        if: steps.version.outputs.changed == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-cache-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install WiX Toolset
        if: steps.version.outputs.changed == 'true'
        run: |
          choco install wixtoolset -y --no-progress
          echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sync version to tauri.conf.json
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # Update version in tauri.conf.json using node
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$PKG_VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\\n');
          "
          echo "Version synced: $PKG_VERSION"

      - name: Build Tauri app
        if: steps.version.outputs.changed == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "Remote Manager ${{ steps.version.outputs.tag }}"
          releaseBody: |
            ## Remote Manager ${{ steps.version.outputs.tag }}

            ### Installation
            - **MSI Installer**: Download `Remote Manager_*_x64_en-US.msi` and run the installer.
            - **Portable ZIP**: Download `Remote Manager_*_x64_en-US.zip`, extract and run `Remote Manager.exe`.

            ### Auto-Update
            The app checks for updates automatically. Install and restart.
          releaseDraft: false
          prerelease: false
          args: "--target ${{ env.RUST_TARGET }}"

      - name: Create portable ZIP
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          EXE="src-tauri/target/${{ env.RUST_TARGET }}/release/remote-manager-mvp.exe"
          ZIP="src-tauri/target/release/bundle/portable.zip"
          mkdir -p portable
          cp "$EXE" "portable/Remote Manager.exe"
          if [ -d "src-tauri/target/${{ env.RUST_TARGET }}/release/resources" ]; then
            cp -r "src-tauri/target/${{ env.RUST_TARGET }}/release/resources/." "portable/"
          fi
          cd portable
          powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../portable-tmp.zip -Force"
          cd ..
          mkdir -p "$(dirname "$ZIP")"
          mv portable-tmp.zip "$ZIP"
          rm -rf portable

      - name: Upload portable ZIP to Release
        if: steps.version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" "src-tauri/target/release/bundle/portable.zip" --clobber
