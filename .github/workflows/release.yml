name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version changed
        id: version
        shell: bash
        run: |
          # Get last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "tag=v0.1.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Compare package.json version with tag
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${LAST_TAG#v}"

          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "tag=v${PKG_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install frontend dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Setup Rust
        if: steps.version.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS and NASM
        if: steps.version.outputs.changed == 'true'
        run: choco install nsis nasm -y --no-progress

      - name: Rust cache
        if: steps.version.outputs.changed == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-cache-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Sync version to tauri.conf.json
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # Update version in tauri.conf.json using node
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$PKG_VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\\n');
          "
          echo "Version synced: $PKG_VERSION"

      - name: Build Tauri app
        if: steps.version.outputs.changed == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "Remote Manager ${{ steps.version.outputs.tag }}"
          releaseBody: |
            ## Remote Manager ${{ steps.version.outputs.tag }}

            ### Installation
            - **Portable ZIP**: Download `Remote Manager_*_x64_en-US.zip`, extract and run `Remote Manager.exe`.

            ### Auto-Update
            The app checks for updates automatically. Install and restart.
releaseDraft: false
          prerelease: false
          # runner is windows-latest (msvc-native); no --target needed

  sciter-release:
    runs-on: windows-latest
    needs: release
    if: needs.release.outputs.changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sciter-app

      - name: Build Sciter app
        run: cargo build --release --manifest-path sciter-app/Cargo.toml

      - name: Download sciter.dll
        shell: bash
        run: |
          curl -L -o sciter-sdk.zip "https://gitlab.com/sciter-engine/sciter-js-sdk/-/archive/main/sciter-js-sdk-main.zip"
          powershell -NoProfile -Command "Expand-Archive -Path sciter-sdk.zip -DestinationPath sdk"
          find sdk -name "sciter.dll" -path "*windows/x64*" -exec cp {} sciter-app/target/release/ \;

      - name: Package portable zip
        shell: bash
        run: |
          mkdir -p portable-sciter
          cp sciter-app/target/release/remote-manager.exe "portable-sciter/Remote Manager Sciter.exe"
          cp sciter-app/target/release/sciter.dll "portable-sciter/"
          cd portable-sciter
          powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../sciter-portable.zip -Force"

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" sciter-portable.zip --clobber
