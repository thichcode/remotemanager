name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  RUST_TARGET: x86_64-pc-windows-gnu

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install NSIS and NASM
        run: choco install nsis nasm -y --no-progress

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-cache-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --target ${{ env.RUST_TARGET }}
