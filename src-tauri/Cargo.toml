[package]
name = "remote-manager-mvp"
version = "0.8.3"
description = "Remote Manager for Windows SysAdmin"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "remote_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
uuid = { version = "1.10", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
base64 = "0.22"
zip = { version = "2.1", features = ["deflate"] }
portable-pty = "0.9"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.62.6", default-features = false, features = ["rsa", "aws-lc-rs", "flate2"] }
russh-sftp = "2.3"
tokio-tungstenite = "0.24"
tungstenite = "0.24"
rdp-rs = "0.1"

[patch.crates-io]
rdp-rs = { path = "vendor/rdp-rs" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_Security",
  "Win32_Globalization",
] }
winreg = "0.55"

[features]
custom-protocol = ["tauri/custom-protocol"]
