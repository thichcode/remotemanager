[package]
name = "remote-manager-sciter"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "remote-manager"
path = "src/main.rs"

[dependencies]
sciter-rs = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
base64 = "0.22"
csv = "1.3"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros", "fs"] }
russh = { version = "0.62", default-features = false, features = ["rsa", "ring", "flate2"] }
russh-sftp = "2.3"
tokio-tungstenite = "0.24"
tungstenite = "0.24"
rdp-rs = "0.1"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = [
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_Security",
] }

[patch.crates-io]
sciter-rs = { path = "vendor-sciter" }
